name: Build Engine arm64 v6 (sinkron struct)

on:
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil source engine
        run: |
          git clone --recursive --depth 1 https://github.com/ZacharyLester/CSMoE-Android zl

      - name: Patch engine
        run: |
          cd zl/app/src/main/jni
          sed -i -e 's/-fgraphite-identity//g' -e 's/-floop-interchange//g' -e 's/-funsafe-loop-optimizations//g' -e 's/-mvectorize-with-neon-quad//g' -e 's/-mfpu=neon//g' -e 's/-mcpu=cortex-a9//g' -e 's/-mthumb//g' -e 's/-finline-limit=256//g' Application.mk xash3d_config.mk
          sed -i -e '213s/return /return (char *)/' -e '219s/return /return (char *)/' src/Xash3D/engine/common/crtlib.h
          for f in $(grep -rl "dlsym-weak" . --include=Android.mk); do sed -i 's/[^ \t]*dlsym-weak\.cpp//g' "$f"; done
          python3 - <<'PY'
import re,glob
p='src/Xash3D/engine/progdefs.h'
s=open(p).read()
assert s.count('} entvars_t;')==1, 'marker entvars_t tidak ketemu'
add=("float round_frags;\nfloat round_frags_headshot;\nfloat round_frags_grenade;\n"
     "float round_frags_knife;\nfloat round_frags_shotgun;\nfloat round_frags_sniper;\nint decryption;\n")
s=s.replace('} entvars_t;', add+'} entvars_t;')
open(p,'w').write(s)
print('progdefs patched')
for f in glob.glob('**/*.[ch]*', recursive=True):
    try:
        t=open(f,encoding='utf8',errors='ignore').read()
    except Exception: continue
    if '%s/lib%s.so' in t:
        open(f,'w',encoding='utf8').write(t.replace('%s/lib%s.so','%.slib%s.so'))
        print('libpath patched:', f)
    if re.search(r'define\s+MAX_USER_MESSAGES\s+\d+', t):
        t2=re.sub(r'(define\s+MAX_USER_MESSAGES\s+)\d+', r'\g<1>1024', t)
        open(f,'w',encoding='utf8').write(t2)
        print('maxmsg patched:', f)
PY
          grep -c "round_frags" src/Xash3D/engine/progdefs.h

      - name: Cek layout sebelum build
        run: |
          cd zl/app/src/main/jni/src/Xash3D
          cat > $GITHUB_WORKSPACE/sz.cpp <<'EOF'
          #include <stdio.h>
          #include <stddef.h>
          #include "common/const.h"
          #include "common/mathlib.h"
          #include "engine/progdefs.h"
          #include "engine/edict.h"
          int main(){
            printf("edict=%zu entvars=%zu\n", sizeof(edict_t), sizeof(entvars_t));
          }
          EOF
          g++ -m64 -w -I. -Iengine -Icommon -Ipublic -DLINUX -DX64BITS $GITHUB_WORKSPACE/sz.cpp -o $GITHUB_WORKSPACE/sz_eng 2>&1 | head -5
          $GITHUB_WORKSPACE/sz_eng | tee $GITHUB_WORKSPACE/layout.txt

      - name: Build arm64
        run: |
          cd zl/app/src/main
          $ANDROID_NDK_HOME/ndk-build -k \
            NDK_PROJECT_PATH=$PWD \
            APP_BUILD_SCRIPT=$PWD/jni/Android.mk \
            NDK_APPLICATION_MK=$PWD/jni/Application.mk \
            APP_ABI=arm64-v8a \
            APP_PLATFORM=android-21 \
            APP_STL=c++_static \
            APP_ALLOW_MISSING_DEPS=true \
            "APP_MODULES=xash menu NanoGL" \
            "APP_CFLAGS=-fPIC -w -Wno-error=incompatible-function-pointer-types -Wno-error=int-conversion -Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types -Wno-error=return-type -Wno-error=deprecated-non-prototype -Wl,--no-undefined" \
            -j$(nproc) > $GITHUB_WORKSPACE/engine6.log 2>&1 || true
          cd $GITHUB_WORKSPACE
          grep -E "error:|\*\*\*|undefined (reference|symbol)" engine6.log | cut -c1-400 | head -120 > errors.txt || true
          mkdir -p out
          find zl -path '*arm64-v8a*' -name '*.so' -exec cp --parents {} out/ \; || true
          find out -type f > hasil.txt || true

      - name: Simpan hasil
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine6-hasil
          path: |
            out/
            layout.txt
            hasil.txt
            errors.txt
            engine6.log
