name: Build Engine arm64 v4

on:
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil source engine
        run: |
          git clone --recursive --depth 1 https://github.com/BillFlx/CSMoE-Android eng
          X=eng/app/src/main/jni/src/Xash3D/engine
          sed -n '205,222p' $X/common/crtlib.h > struktur.txt 2>&1 || true
          grep -rn "dlsym-weak" eng/app/src/main/jni --include=Android.mk >> struktur.txt 2>&1 || true

      - name: Patch untuk arm64 dan Clang
        run: |
          cd eng/app/src/main/jni
          sed -i -e 's/-fgraphite-identity//g' -e 's/-floop-interchange//g' -e 's/-funsafe-loop-optimizations//g' -e 's/-mvectorize-with-neon-quad//g' -e 's/-mfpu=neon//g' -e 's/-mcpu=cortex-a9//g' -e 's/-mthumb//g' -e 's/-finline-limit=256//g' Application.mk xash3d_config.mk
          sed -i -e '213s/return /return (char *)/' -e '219s/return /return (char *)/' src/Xash3D/engine/common/crtlib.h
          for f in $(grep -rl "dlsym-weak" . --include=Android.mk); do
            sed -i 's/[^ \t]*dlsym-weak\.cpp//g' "$f"
          done

      - name: Build arm64 (xash, menu, NanoGL)
        run: |
          cd eng/app/src/main
          $ANDROID_NDK_HOME/ndk-build -k \
            NDK_PROJECT_PATH=$PWD \
            APP_BUILD_SCRIPT=$PWD/jni/Android.mk \
            NDK_APPLICATION_MK=$PWD/jni/Application.mk \
            APP_ABI=arm64-v8a \
            APP_PLATFORM=android-21 \
            APP_STL=c++_static \
            APP_ALLOW_MISSING_DEPS=true \
            "APP_MODULES=xash menu NanoGL" \
            "APP_CFLAGS=-fPIC -w -Wno-error=incompatible-function-pointer-types -Wno-error=int-conversion -Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types -Wno-error=return-type -Wno-error=deprecated-non-prototype -Wl,--no-undefined" \
            -j$(nproc) > $GITHUB_WORKSPACE/engine4.log 2>&1 || true
          cd $GITHUB_WORKSPACE
          grep -E "error:|\*\*\*|undefined (reference|symbol)" engine4.log | cut -c1-400 | head -120 > errors.txt || true
          mkdir -p out
          find eng -path '*arm64-v8a*' -name '*.so' -exec cp --parents {} out/ \; || true
          find out -type f > hasil.txt || true

      - name: Simpan hasil
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine4-hasil
          path: |
            out/
            hasil.txt
            errors.txt
            struktur.txt
            engine4.log
